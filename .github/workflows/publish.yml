name: Publish Package

on:
  push:
    branches: [ main, UAT ]

jobs:
 build:
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        configuration: [Release]


    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v2

    - name: Authenticate to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login-1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish NuGet Package
      uses: Geeksltd/publish-nuget@v2
      with:
        PROJECT_FILE_PATH: Olive.Microservices.Hub.csproj
        NUGET_KEY: ${{ steps.nuget-login-1.outputs.NUGET_API_KEY }}

